name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout react-any-event
        uses: actions/checkout@v4
        with:
          repository: itaym/react-any-event
          path: pkgs/react-any-event

      - name: Checkout react-any-attr
        uses: actions/checkout@v4
        with:
          repository: itaym/react-any-attr
          path: pkgs/react-any-attr

      - name: Checkout isEllipsis
        uses: actions/checkout@v4
        with:
          repository: itaym/isEllipsis
          path: pkgs/isEllipsis

      - name: Checkout react-single-instance
        uses: actions/checkout@v4
        with:
          repository: itaym/react-single-instance
          path: pkgs/react-single-instance

      - name: Checkout tab-indexer
        uses: actions/checkout@v4
        with:
          repository: itaym/tab-indexer
          path: pkgs/tab-indexer

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build react-any-attr package
        working-directory: pkgs/react-any-attr
        run: |
          npm install
          npm run build

      - name: Build react-any-attr playground
        working-directory: pkgs/react-any-attr/playground
        run: |
          npm install
          npx vite build --base ./ --outDir ../../../site/public/playgrounds/react-any-attr

      - name: Build react-any-event package
        working-directory: pkgs/react-any-event
        run: |
          npm install
          npm run build

      - name: Build react-any-event playground
        working-directory: pkgs/react-any-event/playground
        run: |
          npm install
          npx vite build --base ./ --outDir ../../../site/public/playgrounds/react-any-event

      - name: Install isEllipsis workspace
        working-directory: pkgs/isEllipsis
        run: npm install

      - name: Build isEllipsis playground
        working-directory: pkgs/isEllipsis/playground
        run: npx vite build --base ./ --outDir ../../../site/public/playgrounds/isellipsis

      - name: Build react-single-instance package
        working-directory: pkgs/react-single-instance
        run: |
          npm install
          npm run build

      - name: Build react-single-instance playground
        working-directory: pkgs/react-single-instance/playground
        run: |
          npm install
          npx vite build --base ./ --outDir ../../../site/public/playgrounds/react-single-instance

      - name: Install tab-indexer workspace
        working-directory: pkgs/tab-indexer
        run: npm install

      - name: Build tab-indexer packages
        working-directory: pkgs/tab-indexer
        run: npm run build

      - name: Build tab-indexer React example
        working-directory: pkgs/tab-indexer
        run: npx vite build examples/react --base ./ --outDir ../../site/public/playgrounds/tab-indexer

      - name: Install site deps
        working-directory: site
        run: npm install

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
